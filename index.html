<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美团外卖叫号器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #FFD100; font-size: 22px; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255, 209, 0, 0.5); }
        
        .display-area {
            width: 100%;
            max-width: 400px;
            min-height: 100px;
            background-color: #000;
            border: 2px solid #FFD100;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #FFD100;
            word-break: break-all;
            box-shadow: 0 0 20px rgba(255, 209, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .input-group {
            width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 15px; border-radius: 10px; border: 2px solid #333; background-color: #2a2a2a; color: white; font-size: 16px; outline: none; text-align: center;
        }
        input[type="text"]:focus { border-color: #FFD100; }
        
        button {
            padding: 15px; border-radius: 10px; border: none; background-color: #FFD100; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 209, 0, 0.3); transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        .config-panel {
            width: 100%; max-width: 400px; background-color: #222; padding: 15px; border-radius: 12px; border: 1px solid #333;
        }
        .config-panel h3 { margin: 0 0 10px 0; font-size: 14px; color: #888; font-weight: normal; }
        .config-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #bbb; }
        .config-row input[type="range"] { width: 150px; }
        .file-upload-wrapper { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
        .file-upload-wrapper input[type="file"] { font-size: 12px; color: #888; width: 100%; }
    </style>
</head>
<body>

    <h1>🛵 叫号播报系统</h1>

    <!-- 大号显示区域，给顾客看 -->
    <div class="display-area" id="screenText">等待叫号...</div>

    <div class="input-group">
        <!-- 输入文本框 -->
        <input type="text" id="textInput" placeholder="输入顾客听的文字，如：请A102号顾客取餐" />
        <!-- 播报按钮 -->
        <button onclick="startAnnouncement()">🔊 点我播报</button>
    </div>

    <!-- 配置区域 -->
    <div class="config-panel">
        <h3>⚙️ 声音设置（上传你自己的叮咚声）</h3>
        <div class="file-upload-wrapper">
            <input type="file" id="customSoundInput" accept="audio/*" onchange="loadCustomSound(event)">
        </div>
        <button style="padding: 8px 12px; font-size: 12px; margin-top: 5px; background-color: #444; color: white;" onclick="testSound()">🔈 试听叮咚</button>
        
        <h3 style="margin-top: 15px;">🧸 哆啦A梦音效调节</h3>
        <div class="config-row">
            <span>音调（调高更像动漫）</span>
            <input type="range" id="pitchSlider" min="1" max="2" step="0.1" value="1.6">
            <span id="pitchVal">1.6</span>
        </div>
        <div class="config-row">
            <span>语速（调快更活泼）</span>
            <input type="range" id="rateSlider" min="0.8" max="1.5" step="0.1" value="1.1">
            <span id="rateVal">1.1</span>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let customAudio = null;
        let customAudioUrl = null;

        // 监听滑块实时更新数值显示
        document.getElementById('pitchSlider').addEventListener('input', (e) => {
            document.getElementById('pitchVal').textContent = e.target.value;
        });
        document.getElementById('rateSlider').addEventListener('input', (e) => {
            document.getElementById('rateVal').textContent = e.target.value;
        });

        // 1. 加载用户上传的自定义提示音
        function loadCustomSound(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 清理旧的URL，防止内存泄漏
            if (customAudioUrl) { URL.revokeObjectURL(customAudioUrl); }
            if (customAudio) { customAudio.pause(); customAudio = null; }

            customAudioUrl = URL.createObjectURL(file);
            customAudio = new Audio(customAudioUrl);
            customAudio.load();
            alert('自定义提示音已加载！');
        }

        // 试听提示音
        function testSound() {
            playDingDong();
        }

        // 2. 播放提示音（优先播放自定义，否则播放代码合成的）
        function playDingDong() {
            return new Promise((resolve) => {
                // 如果有自定义提示音
                if (customAudio) {
                    customAudio.currentTime = 0;
                    customAudio.play();
                    customAudio.onended = () => { resolve(); };
                    // 保护措施，防止音频卡住
                    setTimeout(() => { if(customAudio) resolve(); }, 3000);
                    return;
                }

                // 默认合成“叮咚”音
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                    
                    const now = audioCtx.currentTime;
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.type = 'sine'; osc1.frequency.value = 880;
                    gain1.gain.setValueAtTime(0.5, now);
                    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc1.connect(gain1); gain1.connect(audioCtx.destination);
                    osc1.start(now); osc1.stop(now + 0.3);

                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine'; osc2.frequency.value = 523.25;
                    gain2.gain.setValueAtTime(0, now + 0.1);
                    gain2.gain.linearRampToValueAtTime(0.5, now + 0.15);
                    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc2.connect(gain2); gain2.connect(audioCtx.destination);
                    osc2.start(now + 0.1); osc2.stop(now + 0.6);

                    osc2.onended = () => {
                        // 【苹果手机核心修复】关闭 AudioContext，把音频通道还给语音播报！
                        if (audioCtx) {
                            audioCtx.close().then(() => { audioCtx = null; resolve(); });
                        } else { resolve(); }
                    };
                } catch (e) {
                    console.warn('提示音失败', e);
                    resolve();
                }
            });
        }

        // 3. 语音播报文字（应用哆啦A梦音效）
        function speakText(text) {
            return new Promise((resolve) => {
                if (!text.trim()) { resolve(); return; }
                
                window.speechSynthesis.cancel(); // 打断上一次
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                
                // 读取用户调节的音调和语速，默认设为哆啦A梦风格
                utterance.pitch = parseFloat(document.getElementById('pitchSlider').value) || 1.6;
                utterance.rate = parseFloat(document.getElementById('rateSlider').value) || 1.1;
                utterance.volume = 1.0;
                
                // 选中文语音
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang.includes('zh'));
                if (zhVoice) utterance.voice = zhVoice;

                utterance.onended = () => resolve();
                utterance.onerror = () => resolve();

                window.speechSynthesis.speak(utterance);
            });
        }

        // 4. 主流程：点击按钮后触发
        async function startAnnouncement() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('请先在文本框输入要播报的内容！');
                return;
            }

            // 更新大屏幕显示
            document.getElementById('screenText').textContent = text;

            // 第一步：播放提示音（自定义或默认）
            await playDingDong();

            // 第二步：等待400毫秒，让苹果系统“喘口气”，交出音频通道
            await new Promise(r => setTimeout(r, 400));

            // 第三步：播报人声
            await speakText(text);
        }
    </script>
</body>
</html>
